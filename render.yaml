# Render Blueprint — deploys the app, Postgres, and Redis together.
#
# Usage: on render.com, "New" -> "Blueprint", point it at this repo. Render
# reads this file and provisions all three services below in one step.
#
# After the first deploy, run the database migrations once via Render's
# Shell tab on the "wfm-app" service:
#
#   flask db upgrade
#
# SMTP_HOST/SMTP_USERNAME/SMTP_PASSWORD/MAIL_FROM_ADDRESS are marked
# sync:false below — Render will prompt for these in the dashboard rather
# than storing them here, since they're real credentials (never commit
# them to this file or anywhere else in the repo).
services:
  - type: web
    name: wfm-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: wfm-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: wfm-redis
          type: keyvalue
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MAIL_FROM_ADDRESS
        sync: false

  - type: keyvalue
    name: wfm-redis
    plan: free
    ipAllowList: []

databases:
  - name: wfm-db
    plan: free
    postgresMajorVersion: "17"
