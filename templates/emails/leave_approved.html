{% extends "emails/_base.html" %}
{% block body %}
<p style="margin:0 0 16px;font-size:16px;font-weight:600;color:#15803d;">Your leave request was approved</p>
<p style="margin:0 0 16px;">Your {{ leave_type_name }} leave request has been approved.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
  <tr>
    <td style="padding:2px 12px 2px 0;color:#71717a;">From</td>
    <td style="padding:2px 0;font-weight:500;">{{ starts_at }}</td>
  </tr>
  <tr>
    <td style="padding:2px 12px 2px 0;color:#71717a;">To</td>
    <td style="padding:2px 0;font-weight:500;">{{ ends_at }}</td>
  </tr>
</table>
{% if decision_note %}
<p style="margin:0;"><strong>Note from your manager:</strong> {{ decision_note }}</p>
{% endif %}
{% endblock %}
